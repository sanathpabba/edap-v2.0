# Databricks jobs generated by tools/generate_pipelines.py from the pipeline folders. NOT yet deployed or validated.
# Tasks run the installed wheel: python_wheel_task -> console command edap-run (see docs/runbooks/build_and_deploy.md).
# One job per pipeline (edap-common, edap-equities, ...) with its stages as tasks, and edap-master which runs Common first, then the asset classes in parallel.
# The master_runner notebook triggers these jobs with parameters (mode, stages, date, extra). Re-generate instead of editing by hand.
resources:
  jobs:
    edap_common:
      name: edap-common
      parameters:
      - name: mode
        default: Routine
      - name: stages
        default: landing,bronze,silver,gold,consumption
      - name: date
        default: ''
      - name: expect_file
        default: 'true'
      - name: extra
        default: ''
      environments:
      - environment_key: edap_env
        spec:
          environment_version: '4'
          dependencies:
          - ${var.wheel_path}
          - databricks-labs-dqx==0.17.2
      tasks:
      - task_key: common_landing
        environment_key: edap_env
        python_wheel_task:
          package_name: edap_framework
          entry_point: edap-run
          parameters:
          - --asset-class
          - Common
          - --layer
          - landing
          - --mode
          - '{{job.parameters.mode}}'
          - --stages
          - '{{job.parameters.stages}}'
          - --run-id
          - '{{job.run_id}}'
          - --extra
          - expect_file={{job.parameters.expect_file}} date={{job.parameters.date}} {{job.parameters.extra}}
      - task_key: common_bronze
        environment_key: edap_env
        depends_on:
        - task_key: common_landing
        python_wheel_task:
          package_name: edap_framework
          entry_point: edap-run
          parameters:
          - --asset-class
          - Common
          - --layer
          - bronze
          - --mode
          - '{{job.parameters.mode}}'
          - --stages
          - '{{job.parameters.stages}}'
          - --run-id
          - '{{job.run_id}}'
          - --extra
          - date={{job.parameters.date}} {{job.parameters.extra}}
      - task_key: common_silver
