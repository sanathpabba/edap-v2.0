# Databricks jobs generated by tools/generate_pipelines.py from the pipeline folders. NOT yet deployed or validated.
# Common runs first; each asset class then runs bronze -> silver -> gold. Re-generate instead of editing by hand.
resources:
  jobs:
    edap_routine_daily:
      name: edap-routine-daily
      schedule:
        quartz_cron_expression: 0 0 6 * * ?
        timezone_id: UTC
        pause_status: PAUSED
      environments: &id001
      - environment_key: edap_env
        spec:
          environment_version: '2'
          dependencies:
          - pyyaml
          - requests
          - databricks-labs-dqx
      tasks:
      - task_key: common_landing
        environment_key: edap_env
        spark_python_task:
          python_file: ../pipelines/run.py
          parameters:
          - --asset-class
          - Common
          - --layer
          - landing
          - --mode
          - Routine
          - --run-id
          - '{{job.run_id}}'
          - --extra
          - expect_file=true
      - task_key: common_bronze
        environment_key: edap_env
        depends_on:
        - task_key: common_landing
        spark_python_task:
          python_file: ../pipelines/run.py
          parameters:
          - --asset-class
          - Common
          - --layer
          - bronze
          - --mode
          - Routine
          - --run-id
          - '{{job.run_id}}'
      - task_key: common_silver
        environment_key: edap_env
        depends_on:
        - task_key: common_bronze
        spark_python_task:
          python_file: ../pipelines/run.py
          parameters:
          - --asset-class
          - Common
          - --layer
          - silver
          - --mode
          - Routine
          - --run-id
          - '{{job.run_id}}'
      - task_key: common_gold
        environment_key: edap_env
        depends_on:
        - task_key: common_silver
        spark_python_task:
          python_file: ../pipelines/run.py
          parameters:
          - --asset-class
          - Common
          - --layer
          - gold
          - --mode
          - Routine
          - --run-id
          - '{{job.run_id}}'
      - task_key: commodities_bronze
        environment_key: edap_env
        depends_on:
        - task_key: common_bronze
        spark_python_task:
          python_file: ../pipelines/run.py
          parameters:
          - --asset-class
          - Commodities
          - --layer
          - bronze
          - --mode
          - Routine
          - --run-id
          - '{{job.run_id}}'
      - task_key: commodities_silver
        environment_key: edap_env
        depends_on:
        - task_key: commodities_bronze
        - task_key: common_silver
        spark_python_task:
          python_file: ../pipelines/run.py
          parameters:
          - --asset-class
          - Commodities
          - --layer
          - silver
          - --mode
          - Routine
          - --run-id
          - '{{job.run_id}}'
      - task_key: commodities_gold
        environment_key: edap_env
        depends_on:
        - task_key: commodities_silver
        - task_key: common_gold
        spark_python_task:
          python_file: ../pipelines/run.py
          parameters:
          - --asset-class
          - Commodities
          - --layer
          - gold
          - --mode
          - Routine
          - --run-id
          - '{{job.run_id}}'
      - task_key: equities_bronze
        environment_key: edap_env
        depends_on:
        - task_key: common_bronze
        spark_python_task:
          python_file: ../pipelines/run.py
          parameters:
          - --asset-class
          - Equities
          - --layer
          - bronze
          - --mode
          - Routine
          - --run-id
          - '{{job.run_id}}'
      - task_key: equities_silver
        environment_key: edap_env
        depends_on:
