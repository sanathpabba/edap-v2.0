    edap_adhoc:
      name: edap-adhoc (initial load / backfill / replay / rebuild)
      environments: *id001
      parameters:
      - name: asset_class
        default: Equities
      - name: layer
        default: bronze
      - name: extra
        default: ''
      tasks:
      - task_key: adhoc
        environment_key: edap_env
        spark_python_task:
          python_file: ../pipelines/run.py
          parameters:
          - --asset-class
          - '{{job.parameters.asset_class}}'
          - --layer
          - '{{job.parameters.layer}}'
          - --mode
          - Adhoc
          - --run-id
          - '{{job.run_id}}'
          - --extra
          - '{{job.parameters.extra}}'
