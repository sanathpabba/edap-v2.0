# Databricks jobs generated by tools/generate_pipelines.py from the pipeline folders. NOT yet deployed or validated.
# Tasks run the installed wheel: python_wheel_task -> console command edap-run (see docs/runbooks/build_and_deploy.md).
# Common runs first; each asset class then runs bronze -> silver -> gold. Re-generate instead of editing by hand.
resources:
  jobs:
    edap_routine_daily:
      name: edap-routine-daily
      schedule:
        quartz_cron_expression: 0 0 6 * * ?
        timezone_id: UTC
        pause_status: PAUSED
      environments:
      - environment_key: edap_env
        spec:
          environment_version: '2'
          dependencies:
          - ../dist/*.whl
          - databricks-labs-dqx==0.17.2
      tasks:
      - task_key: common_landing
        environment_key: edap_env
        python_wheel_task:
          package_name: edap_framework
          entry_point: edap-run
          parameters:
          - --asset-class
          - Common
          - --layer
          - landing
          - --mode
          - Routine
          - --run-id
          - '{{job.run_id}}'
          - --extra
          - expect_file=true
      - task_key: common_bronze
        environment_key: edap_env
        depends_on:
        - task_key: common_landing
        python_wheel_task:
          package_name: edap_framework
          entry_point: edap-run
          parameters:
          - --asset-class
          - Common
          - --layer
          - bronze
          - --mode
          - Routine
          - --run-id
          - '{{job.run_id}}'
      - task_key: common_silver
        environment_key: edap_env
        depends_on:
        - task_key: common_bronze
        python_wheel_task:
          package_name: edap_framework
          entry_point: edap-run
          parameters:
          - --asset-class
          - Common
          - --layer
          - silver
          - --mode
          - Routine
          - --run-id
          - '{{job.run_id}}'
      - task_key: common_gold
        environment_key: edap_env
        depends_on:
        - task_key: common_silver
        python_wheel_task:
          package_name: edap_framework
          entry_point: edap-run
          parameters:
          - --asset-class
          - Common
          - --layer
          - gold
          - --mode
          - Routine
          - --run-id
          - '{{job.run_id}}'
      - task_key: commodities_bronze
        environment_key: edap_env
        depends_on:
        - task_key: common_bronze
        python_wheel_task:
          package_name: edap_framework
          entry_point: edap-run
          parameters:
          - --asset-class
          - Commodities
          - --layer
          - bronze
          - --mode
          - Routine
          - --run-id
          - '{{job.run_id}}'
      - task_key: commodities_silver
        environment_key: edap_env
        depends_on:
        - task_key: commodities_bronze
        - task_key: common_silver
        python_wheel_task:
          package_name: edap_framework
          entry_point: edap-run
          parameters:
          - --asset-class
          - Commodities
          - --layer
          - silver
          - --mode
          - Routine
          - --run-id
          - '{{job.run_id}}'
      - task_key: commodities_gold
