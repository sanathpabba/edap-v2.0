# Canonical mapping: Bronze (file_positions) -> Silver position. Edit expressions/lookups here; the Silver engine has no entity-specific code.
version: 1
entity: position
layer: silver
depends_on: [instrument, portfolio]
target: {catalog: edap, schema: silver, table: ${ac}_position}
business_key: [position_id]
source:
  bronze_table: edap.bronze.${ac}_file_positions
  exclude_quarantined: true          # rows DQ quarantined at Bronze never reach Silver

governance:
  description: "Canonical Position; corrected file versions replace earlier ones; unknown instruments quarantined"
  owner: portfolio-data-owner
  sensitivity: synthetic
columns:
  position_id: "upper(trim(position_id))"
  position_date: "try_to_date(position_date, 'yyyy-MM-dd')"
  portfolio_id: "upper(trim(portfolio_ref))"
  instrument_id: "upper(trim(instrument_code))"
  quantity: "try_cast(position_qty as decimal(18,4))"
  avg_cost: "try_cast(avg_cost as decimal(18,6))"
  market_value: "try_cast(market_value as decimal(22,2))"
  currency: "upper(trim(ccy))"
  source_file_business_date: "to_date(file_business_date, 'yyyyMMdd')"
  source_file_version: "cast(file_version as int)"
lookups:
  - {table: edap.silver.common_portfolio, on: {portfolio_id: portfolio_id}, flag: _ref_portfolio_ok}
  - {table: edap.silver.${ac}_instrument, on: {instrument_id: instrument_id}, flag: _ref_instrument_ok}
dedup:
  partition_by: [position_id]
  order_by: ["source_file_version DESC", "_ingest_ts DESC"]
merge:
  keys: [position_id]
  update_when: "s.source_file_version >= t.source_file_version"
dq: {rules_file: definitions/dq_rules/silver/position.yml}
