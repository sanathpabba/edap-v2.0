# Bronze spec: raw, append-only copy of reference.accounts (no cleansing, no dedup - that is Silver's job).
# Processed on its own (runners/bronze_load.py --source sql-loads --table accounts).
version: 1
layer: bronze
source_system: AZURE_SQL_TRADING
source_object: reference.accounts
table: accounts
input:
  landing_spec: definitions/landing/sql-loads/accounts.yml
  container: landing
  path: sql/accounts
  format: parquet
  reader: autoloader                 # cloudFiles, availableNow trigger => incremental by file
target:
  catalog: edap
  schema: bronze
  table: sql_accounts
  mode: append
  partition_by: [_ingest_date]
  properties:
    delta.enableChangeDataFeed: "true"
business_key: [acct_ref]
columns:
    acct_ref: string
    acct_name: string
    acct_type: string
    ccy: string
    book_cd: string
    custodian: string
    is_active: boolean
    created_ts: timestamp
    last_updated_ts: timestamp
audit_columns:                       # added by the framework, identical for every Bronze table
  _source_system: AZURE_SQL_TRADING
  _source_object: reference.accounts
  _batch_id: bronze_run_batch
  _ingest_ts: current_timestamp
  _ingest_date: current_date
  _source_file: file_path
lineage:
  landing_batch: path            # landing batch_id read from the landing folder name (batch_id=...)
  row_hash: sha256                  # _row_hash over the source columns; detects changed/replayed rows without comparing every column
  stamp: [_run_id, _spec_path, _spec_version, _landing_batch_id]
governance:                         # applied as Unity Catalog comment and tags on the Bronze table
  description: "Raw Azure SQL accounts, append-only, as extracted"
  owner: trading-data-owner
  sensitivity: synthetic
checkpoint:
  container: bronze
  path: _checkpoints/sql_accounts
dq:
  rules_file: definitions/dq_rules/bronze/sql_accounts.yml   # authored in the DQ phase
  mode: later
