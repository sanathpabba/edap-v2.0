# Bronze spec: raw, append-only copy of reference.instruments (no cleansing, no dedup - that is Silver's job).
# Run by pipelines/<AssetClass or Common>/bronze (step files 01-10); table name is prefixed with the pipeline (${ac}_).
version: 1
layer: bronze
source_system: AZURE_SQL_TRADING
source_object: reference.instruments
table: instruments
input:
  landing_spec: definitions/landing/sql-loads/instruments.yml
  container: landing
  path: sql/instruments
  format: parquet
  reader: autoloader                 # cloudFiles, availableNow trigger => incremental by file
target:
  catalog: edap
  schema: bronze
  table: ${ac}_sql_instruments
  mode: append
  partition_by: [_ingest_date]
  properties:
    delta.enableChangeDataFeed: "true"
business_key: [sec_code]
columns:
  sec_code: string
  sec_name: string
  sec_type: string
  ccy: string
  exchange: string
  ticker: string
  isin: string
  sector: string
  country: string
  contract_size: "decimal(18,6)"
  is_active: boolean
  created_ts: timestamp
  last_updated_ts: timestamp
audit_columns:                       # added by the framework, identical for every Bronze table
  _source_system: AZURE_SQL_TRADING
  _source_object: reference.instruments
  _batch_id: bronze_run_batch
  _ingest_ts: current_timestamp
  _ingest_date: current_date
  _source_file: file_path
scope:                              # which rows this pipeline keeps
  by: none
lineage:
  landing_batch: path            # landing batch_id read from the landing folder name (batch_id=...)
  row_hash: sha256                  # _row_hash over the source columns; detects changed/replayed rows without comparing every column
  stamp: [_run_id, _spec_path, _spec_version, _landing_batch_id]
governance:                         # applied as Unity Catalog comment and tags on the Bronze table
  description: "Raw Azure SQL instruments, append-only, as extracted"
  owner: trading-data-owner
  sensitivity: synthetic
checkpoint:
  container: bronze
  path: _checkpoints/${ac}_sql_instruments
dq:
  rules_file: definitions/dq_rules/bronze/sql_instruments.yml   # authored in the DQ phase
  mode: later
