# Landing spec: extract reference.accounts from Azure SQL and write Parquet files into ADLS landing.
# Run by pipelines/Common/landing (step files 01-08), item <this file>.
version: 1
layer: landing
source_system: AZURE_SQL_TRADING
source_definition: definitions/sources/azure_sql_trading.yml
table: accounts
source_object: reference.accounts
extract:
  method: jdbc
  load_type: incremental            # first run (no stored watermark) = full initial load; later runs = delta
  watermark_column: last_updated_ts
  initial_load: full
  fetch_size: 5000
  num_partitions: 1
  columns:
    - acct_ref
    - acct_name
    - acct_type
    - ccy
    - book_cd
    - custodian
    - is_active
    - created_ts
    - last_updated_ts
target:
  container: landing
  path: sql/accounts                    # files land under sql/accounts/ingest_date=YYYY-MM-DD/batch_id=<id>/
  format: parquet
  mode: append
watermark:
  store: edap.metadata.watermarks    # key = AZURE_SQL_TRADING.reference.accounts
  advance_after_success: true        # watermark moves only after the landing write succeeded
audit:
  run_log: edap.audit.ingestion_runs
