# Landing spec: extract source.trades from Azure SQL and write Parquet files into ADLS landing.
# Processed on its own (runners/landing_sql.py --table trades); no other source or table is touched.
version: 1
layer: landing
source_system: AZURE_SQL_TRADING
source_definition: definitions/sources/azure_sql_trading.yml
table: trades
source_object: source.trades
extract:
  method: jdbc
  load_type: incremental            # first run (no stored watermark) = full initial load; later runs = delta
  watermark_column: last_updated_ts
  initial_load: full
  fetch_size: 20000
  num_partitions: 4
  partition_column: trade_dt
  columns:
    - trade_no
    - trade_dt
    - trade_ts
    - settle_dt
    - sec_code
    - book_cd
    - cpty_code
    - acct_ref
    - side
    - qty
    - price
    - trade_ccy
    - gross_amt
    - commission
    - fees
    - net_amt
    - trade_status
    - version
    - trader
    - strategy
    - created_ts
    - last_updated_ts
target:
  container: landing
  path: sql/trades                    # files land under sql/trades/ingest_date=YYYY-MM-DD/batch_id=<id>/
  format: parquet
  mode: append
watermark:
  store: edap.metadata.watermarks    # key = AZURE_SQL_TRADING.source.trades
  advance_after_success: true        # watermark moves only after the landing write succeeded
audit:
  run_log: edap.audit.ingestion_runs
