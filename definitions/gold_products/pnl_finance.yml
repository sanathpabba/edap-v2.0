version: 1
product: pnl_finance
layer: gold
target: {catalog: edap, schema: gold, table: ${ac}_pnl_finance}
documentation:
  business_purpose: Daily unrealised P&L and trading costs per portfolio in USD for finance review
  grain: one row per position_date x portfolio
  source_entities: [position, trade, portfolio, market_data]
  major_measures: [market_value_usd, cost_basis_usd, unrealized_pnl_usd, trading_costs_usd, pnl_after_costs_usd, trade_count]
  major_dimensions: [position_date, portfolio, business_unit]
  owner: finance-data-owner
  dq_expectations: unique grain; P&L equals market value minus cost basis
  refresh_pattern: full rebuild after Silver position and trade loads (daily)
  intended_consumers: [Finance, Management reporting]
with:
  - name: pos
    sql: "SELECT s.position_date, s.portfolio_id, sum(s.market_value * f.usd_per_unit) AS mv, sum(s.quantity * s.avg_cost * i.contract_size * f.usd_per_unit) AS cost FROM edap.silver.${ac}_position s LEFT JOIN edap.silver.${ac}_instrument i ON i.instrument_id = s.instrument_id LEFT JOIN edap.gold.common_fx_rate_daily f ON f.rate_date = s.position_date AND f.currency = s.currency GROUP BY s.position_date, s.portfolio_id"
  - name: costs
    sql: "SELECT t.trade_date AS position_date, t.portfolio_id, sum((t.commission + t.fees) * f.usd_per_unit) AS trading_costs, count(*) AS trade_count FROM edap.silver.${ac}_trade t LEFT JOIN edap.gold.common_fx_rate_daily f ON f.rate_date = t.trade_date AND f.currency = t.currency WHERE t.trade_status <> 'CANCELLED' GROUP BY t.trade_date, t.portfolio_id"
from: {table: pos, alias: pos}
joins:
  - {type: left, table: costs, alias: c, on: "c.position_date = pos.position_date AND c.portfolio_id = pos.portfolio_id"}
  - {type: left, table: edap.silver.common_portfolio, alias: p, on: "pos.portfolio_id = p.portfolio_id"}
select:
  dimensions:
    position_date: "pos.position_date"
    portfolio_id: "pos.portfolio_id"
    portfolio_name: "p.portfolio_name"
    business_unit: "p.business_unit"
  measures:
    market_value_usd: "round(pos.mv, 2)"
    cost_basis_usd: "round(pos.cost, 2)"
    unrealized_pnl_usd: "round(pos.mv - pos.cost, 2)"
    trading_costs_usd: "round(coalesce(c.trading_costs, 0), 2)"
    pnl_after_costs_usd: "round(pos.mv - pos.cost - coalesce(c.trading_costs, 0), 2)"
    trade_count: "coalesce(c.trade_count, 0)"
dq: {rules_file: definitions/dq_rules/gold/pnl_finance.yml}
