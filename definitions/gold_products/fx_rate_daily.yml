# Conformed dimension: one FX rate per calendar day and currency (weekends/holidays carry the last known rate).
# Every Gold product converts to USD through this table, so the conversion rule exists once.
version: 1
product: fx_rate_daily
layer: gold
target: {catalog: edap, schema: gold, table: fx_rate_daily}
documentation:
  business_purpose: Single, gap-free USD conversion rate per currency and calendar day
  grain: one row per rate_date x currency
  source_entities: [market_data]
  major_measures: [usd_per_unit]
  major_dimensions: [rate_date, currency]
  owner: market-data-owner
  dq_expectations: no missing rate for any approved currency; filled days are flagged
  refresh_pattern: full rebuild after each Silver market_data load
  intended_consumers: [trade_analytics, position_exposure, pnl_finance, regulatory_reporting]
with:
  - {name: bounds, sql: "SELECT min(rate_date) AS mn, max(rate_date) AS mx FROM edap.silver.market_data"}
  - {name: cal, sql: "SELECT explode(sequence(mn, mx, interval 1 day)) AS cal_date FROM bounds"}
  - {name: ccy, sql: "SELECT DISTINCT quote_currency AS currency FROM edap.silver.market_data"}
from: {table: cal, alias: c}
joins:
  - {type: cross, table: ccy, alias: y}
  - {type: left, table: edap.silver.market_data, alias: m, on: "m.rate_date = c.cal_date AND m.quote_currency = y.currency AND m.base_currency = 'USD'"}
select:
  dimensions:
    rate_date: "c.cal_date"
    currency: "y.currency"
  measures:
    usd_per_unit: "last_value(m.usd_per_unit, true) OVER (PARTITION BY y.currency ORDER BY c.cal_date ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)"
    is_filled: "m.usd_per_unit IS NULL"
column_comments:
  usd_per_unit: "USD value of one unit of the currency (1 / rate quoted per USD)"
  is_filled: "true when the rate was carried forward from the previous available day"
