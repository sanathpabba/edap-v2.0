# Asset-class pipeline definition. The pipeline code under pipelines/FX/ is generic; this file says what it covers.
name: Foreign Exchange
folder: FX
prefix: fx                       # used in table names: edap.<layer>.fx_<table>
sec_types: [FX]                  # source security types routed to this asset class (reference: instrument_classification)
receives_unresolved: false          # rows whose instrument is unknown to every asset class land here so DQ can quarantine them
description: "FX spot and forward instruments"
items:                           # what each layer processes, in order
  bronze: [sql-loads/trades, file-loads/positions, stream-loads/trade_events]
  silver: [instrument, trade, position, trade_event]
  gold: [trade_analytics, position_exposure, pnl_finance, regulatory_reporting]
  consumption: [trade_metrics, exposure_metrics, trade_daily_mv, portfolio_exposure_mv]
