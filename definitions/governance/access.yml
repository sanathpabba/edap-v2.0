# Personas (account-level groups) and what each may do. Applied with GRANT statements.
# Prerequisite: create these groups once at the Databricks ACCOUNT level (groups used in Unity Catalog grants must be account groups).
groups:
  edap_data_engineers: "Build and operate the platform (all layers)"
  edap_analysts:       "Business analysts: Gold products except regulatory reporting"
  edap_risk_regulatory: "Risk and compliance: all Gold products including regulatory reporting, unmasked identifiers"
  edap_finance:        "Finance: trade, position and P&L products"
catalog: edap
grants:
  - {principal: edap_data_engineers, privileges: ["ALL PRIVILEGES"], on: {type: CATALOG, name: edap}}
  - {principal: edap_analysts, privileges: ["USE CATALOG"], on: {type: CATALOG, name: edap}}
  - {principal: edap_analysts, privileges: ["USE SCHEMA"], on: {type: SCHEMA, name: edap.gold}}
  - {principal: edap_analysts, privileges: ["SELECT"], on: {type: TABLE, name: edap.gold.trade_analytics}}
  - {principal: edap_analysts, privileges: ["SELECT"], on: {type: TABLE, name: edap.gold.position_exposure}}
  - {principal: edap_analysts, privileges: ["SELECT"], on: {type: TABLE, name: edap.gold.fx_rate_daily}}
  - {principal: edap_finance, privileges: ["USE CATALOG"], on: {type: CATALOG, name: edap}}
  - {principal: edap_finance, privileges: ["USE SCHEMA"], on: {type: SCHEMA, name: edap.gold}}
  - {principal: edap_finance, privileges: ["SELECT"], on: {type: TABLE, name: edap.gold.trade_analytics}}
  - {principal: edap_finance, privileges: ["SELECT"], on: {type: TABLE, name: edap.gold.position_exposure}}
  - {principal: edap_finance, privileges: ["SELECT"], on: {type: TABLE, name: edap.gold.pnl_finance}}
  - {principal: edap_finance, privileges: ["SELECT"], on: {type: TABLE, name: edap.gold.fx_rate_daily}}
  - {principal: edap_risk_regulatory, privileges: ["USE CATALOG"], on: {type: CATALOG, name: edap}}
  - {principal: edap_risk_regulatory, privileges: ["USE SCHEMA", "SELECT"], on: {type: SCHEMA, name: edap.gold}}
  - {principal: edap_risk_regulatory, privileges: ["USE SCHEMA", "SELECT"], on: {type: SCHEMA, name: edap.silver}}
denied_access_demo:
  description: "An analyst querying gold.regulatory_reporting must be refused (no grant)"
  as_group: edap_analysts
  query: "SELECT * FROM edap.gold.regulatory_reporting LIMIT 5"
  expect: PERMISSION_DENIED
