# Lineage reporting. Table and column lineage itself is captured automatically by Unity Catalog (system.access.*_lineage);
# this file says which end-to-end paths to report and which record traces to demonstrate.
products: [trade_analytics, position_exposure, pnl_finance, regulatory_reporting]   # expanded over every asset class: edap.gold.<prefix>_<product>
max_depth: 6
report_table: edap.monitoring.lineage_paths
record_trace:
  # ${ac} is replaced for each asset class; the record is looked up in each until found
  trade:    {silver_table: edap.silver.${ac}_trade,       key: trade_id,    bronze_table: edap.bronze.${ac}_sql_trades}
  position: {silver_table: edap.silver.${ac}_position,    key: position_id, bronze_table: edap.bronze.${ac}_file_positions}
  event:    {silver_table: edap.silver.${ac}_trade_event, key: event_id,    bronze_table: edap.bronze.${ac}_stream_trade_events}
