# Column masks (Unity Catalog): sensitive columns are masked unless the user is in an allowed group.
masks:
  - name: mask_lei
    schema: edap.governance
    table: edap.silver.counterparty
    column: legal_entity_identifier
    allowed_groups: [edap_data_engineers, edap_risk_regulatory]
    function_sql: "CASE WHEN {allowed} THEN lei ELSE concat(substr(lei, 1, 4), '****************') END"
    argument: "lei STRING"
    returns: STRING
    description: "Legal Entity Identifier: first 4 characters visible to everyone else; full value for risk/regulatory and engineers"
