# Environment settings (no secrets). Specs refer to containers/paths; this file resolves them.
environment: dev
catalog: edap
storage:
  account: edapdl
  containers: {sourcedrop: sourcedrop, landing: landing, bronze: bronze, silver: silver, gold: gold, metadata: metadata}   # sourcedrop = stand-in for the source system's own storage (SFTP/share)
  uri_template: "abfss://{container}@{account}.dfs.core.windows.net/{path}"
secrets:
  scope: edap-kv                       # Key Vault-backed Databricks secret scope
  keys:                                # logical name -> secret name in the scope
    sql_server: sql-server-name
    sql_database: sql-database-name
    sql_user: sql-admin-user
    sql_password: sql-admin-password
    eventhub_listen: eventhub-listen-connection-string
    smtp_host: smtp-host                 # notifier (SMTP); create these in Key Vault before enabling email
    smtp_user: smtp-user
    smtp_password: smtp-password
eventhub_namespace: edap-eventhubs-645ca5
schemas: {bronze: bronze, metadata: metadata, audit: audit}
consumption:
  sql_warehouse_id: ""               # empty = run the statements on the job's own serverless compute; set a (serverless) SQL warehouse id if metric/materialized views need one
