# DQX rule set (declarative). Edit/add checks here; no code change needed.
# criticality: error = row quarantined, warn = row passes and the warning is recorded.
version: 1
rule_set: silver.${ac}_market_data
layer: silver
target_table: edap.silver.${ac}_market_data
mode: quarantine
description: Enterprise rules for Market Data (FX)
checks:
- name: rate_date_not_null
  criticality: error
  check:
    function: is_not_null
    arguments:
      column: rate_date
- name: fx_key_unique
  criticality: error
  check:
    function: is_unique
    arguments:
      columns:
      - rate_date
      - base_currency
      - quote_currency
- name: quote_currency_approved
  criticality: error
  check:
    function: is_in_list
    arguments:
      column: quote_currency
      allowed:
      - '''USD'''
      - '''EUR'''
      - '''GBP'''
      - '''JPY'''
      - '''CHF'''
      - '''AUD'''
      - '''CAD'''
      - '''SGD'''
      - '''HKD'''
- name: rate_positive
  criticality: error
  check:
    function: sql_expression
    arguments:
      expression: rate > 0
      msg: rate must be > 0
