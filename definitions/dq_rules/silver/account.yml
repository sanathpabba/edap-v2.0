# DQX rule set (declarative). Edit/add checks here; no code change needed.
# criticality: error = row quarantined, warn = row passes and the warning is recorded.
version: 1
rule_set: silver.account
layer: silver
target_table: edap.silver.account
mode: quarantine
description: Enterprise rules for Account
checks:
- name: account_id_not_null
  criticality: error
  check:
    function: is_not_null
    arguments:
      column: account_id
- name: account_id_unique
  criticality: error
  check:
    function: is_unique
    arguments:
      columns:
      - account_id
- name: portfolio_resolves
  criticality: error
  check:
    function: sql_expression
    arguments:
      expression: _ref_portfolio_ok
      msg: account references an unknown portfolio
- name: currency_approved
  criticality: error
  check:
    function: is_in_list
    arguments:
      column: currency
      allowed:
      - '''USD'''
      - '''EUR'''
      - '''GBP'''
      - '''JPY'''
      - '''CHF'''
      - '''AUD'''
      - '''CAD'''
      - '''SGD'''
      - '''HKD'''
