# DQX rule set (declarative). Edit/add checks here; no code change needed.
# criticality: error = row quarantined, warn = row passes and the warning is recorded.
version: 1
rule_set: bronze.sql_counterparties
layer: bronze
target_table: edap.bronze.sql_counterparties
mode: quarantine
description: Technical checks on raw counterparty rows
checks:
- name: cpty_code_not_null
  criticality: error
  check:
    function: is_not_null
    arguments:
      column: cpty_code
- name: cpty_code_format
  criticality: error
  check:
    function: regex_match
    arguments:
      column: cpty_code
      regex: ^CPTY\d{4}$
- name: cpty_code_unique
  criticality: error
  check:
    function: is_unique
    arguments:
      columns:
      - cpty_code
- name: risk_category_allowed
  criticality: error
  check:
    function: is_in_list
    arguments:
      column: risk_category
      allowed:
      - '''LOW'''
      - '''MEDIUM'''
      - '''HIGH'''
- name: lei_format
  criticality: error
  check:
    function: regex_match
    arguments:
      column: lei
      regex: ^[A-Z0-9]{20}$
- name: last_updated_ts_not_null
  criticality: error
  check:
    function: is_not_null
    arguments:
      column: last_updated_ts
