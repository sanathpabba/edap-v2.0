# DQX rule set (declarative). Edit/add checks here; no code change needed.
# criticality: error = row quarantined, warn = row passes and the warning is recorded.
version: 1
rule_set: bronze.api_fx_rates
layer: bronze
target_table: edap.bronze.api_fx_rates
mode: quarantine
description: Technical checks on landed FX envelopes; stale pulls are warnings, not rejections
checks:
- name: http_ok
  criticality: error
  check:
    function: sql_expression
    arguments:
      expression: CAST(http_status AS INT) = 200
      msg: API did not return HTTP 200
- name: response_json_not_null
  criticality: error
  check:
    function: is_not_null
    arguments:
      column: response_json
- name: requested_date_not_null
  criticality: error
  check:
    function: is_not_null
    arguments:
      column: requested_date
- name: not_stale
  criticality: warn
  check:
    function: sql_expression
    arguments:
      expression: stale = 'false'
      msg: API returned the previous business day (weekend/holiday)
