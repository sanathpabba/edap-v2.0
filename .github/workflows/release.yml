# Release: tag vX.Y.Z -> build the wheel and attach it to a GitHub release.
# Publish: run manually (workflow_dispatch, deploy_target = dev) to upload the wheel to the Unity Catalog volume. That is all a notebook or job needs:
#   %pip install /Volumes/edap/metadata/artifacts/<wheel>
# Optional: tick deploy_jobs to also deploy the Databricks jobs (bundle). Needs the secrets below, protected by an environment approval.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "Publish the wheel to this target (dev | test | prod); empty = build only"
        required: false
        default: ""
      deploy_jobs:
        description: "Also deploy the jobs bundle (default: wheel only)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-ci.txt
      - run: python runners/validate_definitions.py && python -m pytest tests -q

      - name: Tag must match the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V=$(python -c "import edap_framework; print(edap_framework.__version__)")
          [ "v$V" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match package version v$V"; exit 1; }

      - name: Build wheel (no suffix for a tagged release, sha suffix otherwise)
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            python tools/build_wheel.py
          else
            python tools/build_wheel.py --version-suffix "$(git rev-parse --short HEAD)"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: edap-framework-wheel
          path: dist/*.whl

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl

  publish:
    needs: build
    if: ${{ github.event.inputs.deploy_target != '' }}
    runs-on: ubuntu-24.04
    environment: databricks-${{ github.event.inputs.deploy_target }}     # configure required reviewers on this environment
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}                      # secrets live in GitHub, never in the repository
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}            # OAuth machine-to-machine service principal
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      TARGET: ${{ github.event.inputs.deploy_target }}
      DEPLOY_JOBS: ${{ github.event.inputs.deploy_jobs }}
      VOLUME: /Volumes/edap/metadata/artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4                                 # the wheel built by the build job: no rebuild, no repo sync
        with:
          name: edap-framework-wheel
          path: dist
      - uses: databricks/setup-cli@main                                    # pin to a released version once chosen

      - name: Upload the wheel to the Unity Catalog volume
        run: |
          WHEEL=$(ls dist/edap_framework-*.whl)
          NAME=$(basename "$WHEEL")
          databricks fs cp "$WHEEL" "dbfs:$VOLUME/$NAME" --overwrite
          echo "WHEEL_PATH=$VOLUME/$NAME" >> "$GITHUB_ENV"
          echo "Published wheel: \`$VOLUME/$NAME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Install in a notebook: \`%pip install $VOLUME/$NAME\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy the jobs (only when deploy_jobs is ticked)
        if: ${{ github.event.inputs.deploy_jobs == 'true' }}
        run: |
          databricks bundle validate -t "$TARGET" --var "wheel_path=$WHEEL_PATH"
          databricks bundle deploy -t "$TARGET" --var "wheel_path=$WHEEL_PATH"
