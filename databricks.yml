bundle:
  name: edap

include:
  - deployment/jobs.yml        # generated by tools/generate_pipelines.py; tasks run the wheel below

artifacts:
  edap_framework:              # `databricks bundle deploy` builds this and uploads it; jobs install it via ../dist/*.whl
    type: whl
    build: python3 tools/build_wheel.py --out dist
    path: .

sync:                          # never upload credentials, local environments or generated data to the workspace
  exclude:
    - .databrickscfg*
    - chat.json
    - config/*.env
    - .env*
    - .venv/**
    - source_generators/output/**
    - tests/**
    - docs/**

targets:
  dev:
    default: true
    mode: development
  test: {}
  prod:
    mode: production
