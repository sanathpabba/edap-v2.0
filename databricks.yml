bundle:
  name: edap

include:
  - deployment/jobs.yml        # generated by tools/generate_pipelines.py; tasks run the wheel from the UC volume

variables:
  wheel_path:                  # the published wheel the jobs install (CI publishes it; override with --var wheel_path=...)
    description: Unity Catalog volume path of the edap_framework wheel
    default: /Volumes/edap/metadata/artifacts/edap_framework-0.1.0-py3-none-any.whl

sync:                          # the wheel already contains the code, definitions and pipelines: sync only the small deployment folder
  paths:
    - deployment

targets:
  dev:
    default: true
    mode: development
  test: {}
  prod:
    mode: production
